# Android Studio's SDK, the one with accepted licences, for processes that skip ~/.zshenv
ANDROID_HOME=${HOME}/Android/Sdk
ANDROID_SDK_ROOT=${HOME}/Android/Sdk
# The Android CLI behind sdkmanager uploads usage metrics and ignores the
# ~/.android/analytics.settings opt-out; point its uploads at a closed port
ANDROID_CLI_ANALYTICS_URL=http://127.0.0.1:9
ANDROID_CLI_CRASH_URL=http://127.0.0.1:9
