# Fix color
set -sa terminal-overrides ",xterm*:Tc"
# Enable mouse
set -g mouse on

# Set prefix
set -g prefix C-a

# Keep sessions after the last client disconnects
set-option -g destroy-unattached off

# Shift-Alt-arrow keys to switch windows
bind -n S-M-Left previous-window
bind -n S-M-Right next-window

# Alt-arrow keys to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'jaclu/tmux-menus'
set -g @yank_with_mouse off
set -g @menus_trigger 'Enter'

# Theme options
set -g @plugin 'o0th/tmux-nova'
set -g @plugin 'rockofox/tmux-drag'

set -g @nova-nerdfonts true
set -g @nova-nerdfonts-left 
set -g @nova-nerdfonts-right 
set -g @nova-segment-mode "#{?client_prefix,Ω,ω}"
set -g @nova-segment-mode-colors "#50fa7b #282a36"
set -g @nova-segment-whoami "#(whoami)@#h"
set -g @nova-segment-whoami-colors "#50fa7b #282a36"
set -g @nova-pane "#I#{?pane_in_mode,  #{pane_mode},}  #W"
set -g @nova-rows 0
set -g @nova-segments-0-left "mode"
set -g @nova-segments-0-right "whoami"

# Set vi-mode
#setw -g mode-keys vi
# Keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X recopy-selection
bind-key -T copy-mode-vi Escape send-keys -X cancel

# My split bindings
bind '\' split-window -h -c "#{pane_current_path}"
bind ']' split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Reapply tmux-drag after the theme regenerates the window status formats
set -gu @tmux-drag-tabs-loaded
run "~/.tmux/plugins/tpm/tpm"

# Keep mouse-drag selections active and show their character count
setw -g copy-mode-position-format '#[align=right]#{?selection_active,selecting...,#{?selection_present,#{@selection_count} selected,#{t/p:top_line_time}#{?#{e|>:#{top_line_time},0}, ,}[#{copy_position}/#{copy_position_limit}]}}'
bind-key -T copy-mode MouseDown1Pane send-keys -X cancel
bind-key -T copy-mode-vi MouseDown1Pane send-keys -X cancel
bind-key -T root DoubleClick1Pane select-pane -t = \; if-shell -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' { send-keys -M } { copy-mode -H ; send-keys -X select-word ; send-keys -X copy-pipe-no-clear 'count=$(wc -m); tmux set-option -wq -t "$TMUX_PANE" @selection_count "$count"; tmux send-keys -X -t "$TMUX_PANE" stop-selection; tmux refresh-client' }
bind-key -T copy-mode DoubleClick1Pane select-pane \; send-keys -X select-word \; send-keys -X copy-pipe-no-clear 'count=$(wc -m); tmux set-option -wq -t "$TMUX_PANE" @selection_count "$count"; tmux send-keys -X -t "$TMUX_PANE" stop-selection; tmux refresh-client'
bind-key -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; send-keys -X copy-pipe-no-clear 'count=$(wc -m); tmux set-option -wq -t "$TMUX_PANE" @selection_count "$count"; tmux send-keys -X -t "$TMUX_PANE" stop-selection; tmux refresh-client'
bind-key -T root TripleClick1Pane select-pane -t = \; if-shell -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' { send-keys -M } { copy-mode -H ; send-keys -X select-line ; send-keys -X copy-pipe-no-clear 'count=$(wc -m); tmux set-option -wq -t "$TMUX_PANE" @selection_count "$count"; tmux send-keys -X -t "$TMUX_PANE" stop-selection; tmux refresh-client' }
bind-key -T copy-mode TripleClick1Pane select-pane \; send-keys -X select-line \; send-keys -X copy-pipe-no-clear 'count=$(wc -m); tmux set-option -wq -t "$TMUX_PANE" @selection_count "$count"; tmux send-keys -X -t "$TMUX_PANE" stop-selection; tmux refresh-client'
bind-key -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; send-keys -X copy-pipe-no-clear 'count=$(wc -m); tmux set-option -wq -t "$TMUX_PANE" @selection_count "$count"; tmux send-keys -X -t "$TMUX_PANE" stop-selection; tmux refresh-client'
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-no-clear 'count=$(wc -m); tmux set-option -wq -t "$TMUX_PANE" @selection_count "$count"; tmux send-keys -X -t "$TMUX_PANE" stop-selection; tmux refresh-client'
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-no-clear 'count=$(wc -m); tmux set-option -wq -t "$TMUX_PANE" @selection_count "$count"; tmux send-keys -X -t "$TMUX_PANE" stop-selection; tmux refresh-client'

# Keep right-click menus open after releasing the button
bind-key -T root MouseDown3Pane if-shell -F -t = "#{||:#{mouse_any_flag},#{&&:#{pane_in_mode},#{?#{m/r:(copy|view)-mode,#{pane_mode}},0,1}}}" { select-pane -t = ; send-keys -M } { display-menu -O -T "#[align=centre]#{pane_index} (#{pane_id})" -t = -x M -y M "#{?#{m/r:(copy|view)-mode,#{pane_mode}},Go To Top,}" < { send-keys -X history-top } "#{?#{m/r:(copy|view)-mode,#{pane_mode}},Go To Bottom,}" > { send-keys -X history-bottom } '' "#{?#{&&:#{buffer_size},#{!:#{pane_in_mode}}},Paste #[underscore]#{=/9/...:buffer_sample},}" p { paste-buffer } '' "#{?mouse_word,Search For #[underscore]#{=/9/...:mouse_word},}" C-r { if-shell -F "#{?#{m/r:(copy|view)-mode,#{pane_mode}},0,1}" "copy-mode -t=" ; send-keys -X -t = search-backward -- "#{q:mouse_word}" } "#{?mouse_word,Type #[underscore]#{=/9/...:mouse_word},}" C-y { copy-mode -q ; send-keys -l "#{q:mouse_word}" } "#{?mouse_word,Copy #[underscore]#{=/9/...:mouse_word},}" c { copy-mode -q ; set-buffer "#{q:mouse_word}" } "#{?mouse_line,Copy Line,}" l { copy-mode -q ; set-buffer "#{q:mouse_line}" } '' "#{?mouse_hyperlink,Type #[underscore]#{=/9/...:mouse_hyperlink},}" C-h { copy-mode -q ; send-keys -l "#{q:mouse_hyperlink}" } "#{?mouse_hyperlink,Copy #[underscore]#{=/9/...:mouse_hyperlink},}" h { copy-mode -q ; set-buffer "#{q:mouse_hyperlink}" } '' "#{?#{!:#{pane_floating_flag}},Horizontal Split,}" h { split-window -h } "#{?#{!:#{pane_floating_flag}},Vertical Split,}" v { split-window -v } '' "#{?#{&&:#{!:#{pane_floating_flag}},#{>:#{window_panes},1}},Swap Up,}" u { swap-pane -U } "#{?#{&&:#{!:#{pane_floating_flag}},#{>:#{window_panes},1}},Swap Down,}" d { swap-pane -D } "#{?pane_marked_set,,-}Swap Marked" s { swap-pane } '' Kill X { kill-pane } Respawn R { respawn-pane -k } "#{?pane_marked,Unmark,Mark}" m { select-pane -m } '' "#{?#{>:#{window_panes},1},,-}#{?window_zoomed_flag,Unzoom,Zoom}" z { resize-pane -Z } }
bind-key -T root MouseDown3Status display-menu -O -T "#[align=centre]#{window_index}:#{window_name}" -t = -x W -y W "#{?#{>:#{session_windows},1},,-}Swap Left" l { swap-window -t :-1 } "#{?#{>:#{session_windows},1},,-}Swap Right" r { swap-window -t :+1 } "#{?pane_marked_set,,-}Swap Marked" s { swap-window } '' Kill X { kill-window } Respawn R { respawn-window -k } "#{?pane_marked,Unmark,Mark}" m { select-pane -m } Rename n { command-prompt -F -I "#W" { rename-window -t "#{window_id}" "%%" } } '' "New After" w { new-window -a } "New At End" W { new-window }
bind-key -T root MouseDown3StatusLeft display-menu -O -T "#[align=centre]#{session_name}" -t = -x M -y W Next n { switch-client -n } Previous p { switch-client -p } '' Renumber N { move-window -r } Rename r { command-prompt -I "#S" { rename-session "%%" } } Detach d { detach-client } '' "New Session" s { new-session } "New Window" w { new-window }
